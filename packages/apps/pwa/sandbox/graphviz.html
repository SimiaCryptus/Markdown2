<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Opaque-origin sandbox for Graphviz. 'wasm-unsafe-eval' lets the embedded WebAssembly
      module compile; it does not allow JavaScript eval. Nothing is fetched from the web.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src data:; connect-src 'self' ws:"
    />
    <title>Graph</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { width: 100%; padding: 0.5rem 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sandbox/graphviz.ts"></script>
  </body>
</html>
