<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Opaque-origin sandbox. Google Charts is loaded from www.gstatic.com and can reach nothing of the
      app. 'unsafe-eval' is allowed for the Google loader; it buys nothing outside this frame.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src data: https://www.gstatic.com; connect-src 'self' ws: https://www.gstatic.com"
    />
    <title>Chart</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #root { width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sandbox/gchart.ts"></script>
  </body>
</html>
