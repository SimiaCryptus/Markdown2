name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let every matrix leg report
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci

      - name: Quality gate (fail-at-end)
        run: npm run check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports-node${{ matrix.node }}
          path: |
            packages/core/coverage/
            packages/core/reports/
          if-no-files-found: ignore